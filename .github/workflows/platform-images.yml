name: platform-images

# Construye las imágenes de la plataforma (runner self-hosted y mocks de proveedores) y las sube a ghcr.
# El tag es sha-<último commit que tocó la carpeta de la imagen>: no cambia si se mergea algo que no la toca, y
# es el que se pone en las variables gh_runner_tag / vendor_mock_tag (platform/variables.tf).
on:
  push:
    branches: [main]
    paths:
      - "platform/gh-runner/**"
      - "platform/vendor-mocks/**"
      - ".github/workflows/platform-images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: gh-runner
            context: platform/gh-runner
          - name: vendor-mock
            context: platform/vendor-mocks
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: tag
        run: echo "tag=sha-$(git log -1 --format=%h -- '${{ matrix.context }}')" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false
          tags: ghcr.io/${{ github.repository_owner }}/${{ matrix.name }}:${{ steps.tag.outputs.tag }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
